<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a74a8"/>
      <stop offset="1" stop-color="#1d4468"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2236" flood-opacity="0.35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Body on the macOS icon grid: 824×824 at 100,100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#outer)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Two sheets behind: the library -->
  <g transform="rotate(-9 512 540)" filter="url(#shadow)">
    <rect x="322" y="250" width="380" height="490" rx="22" fill="#c9d8e6"/>
  </g>
  <g transform="rotate(5 512 540)" filter="url(#shadow)">
    <rect x="322" y="250" width="380" height="490" rx="22" fill="#dfe8f0"/>
  </g>

  <!-- Front sheet with a folded corner -->
  <g filter="url(#shadow)">
    <path d="M 322 262 Q 322 240 344 240 L 612 240 L 702 330 L 702 738 Q 702 760 680 760 L 344 760 Q 322 760 322 738 Z" fill="url(#sheet)"/>
    <path d="M 612 240 L 612 308 Q 612 330 634 330 L 702 330 Z" fill="#cdd7e1"/>
  </g>

  <!-- Title and text lines -->
  <rect x="370" y="300" width="200" height="26" rx="13" fill="#1d4468"/>
  <rect x="370" y="360" width="284" height="14" rx="7" fill="#9fb2c4"/>
  <!-- Highlighter stroke across one line -->
  <rect x="358" y="402" width="306" height="42" rx="10" fill="#ffd84a" opacity="0.92"/>
  <rect x="370" y="416" width="262" height="14" rx="7" fill="#7d6a1c"/>
  <rect x="370" y="472" width="284" height="14" rx="7" fill="#9fb2c4"/>
  <rect x="370" y="516" width="230" height="14" rx="7" fill="#9fb2c4"/>
  <rect x="370" y="560" width="270" height="14" rx="7" fill="#9fb2c4"/>
  <rect x="370" y="604" width="190" height="14" rx="7" fill="#9fb2c4"/>
  <rect x="370" y="648" width="250" height="14" rx="7" fill="#9fb2c4"/>
</svg>
