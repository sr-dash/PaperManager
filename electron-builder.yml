appId: org.sr-dash.papermanager
productName: PaperManager
directories:
  buildResources: build
# Name what ships instead of excluding what doesn't:
# the bundles and the license. Production dependencies are added on top.
files:
  - 'out/**'
  - 'package.json'
  - 'LICENSE'
  # pdfjs-dist is loaded by the main process for text extraction; the renderer bundles its own copy.
  - '!node_modules/pdfjs-dist/{types,web,image_decoders}/**'
  - '!node_modules/pdfjs-dist/**/*.map'
mac:
  category: public.app-category.education
  icon: build/icon.icns
  # Ad-hoc signature: required for Apple Silicon to launch the app from Finder.
  # There is no Developer ID here, so Gatekeeper will still ask on other machines.
  identity: '-'
  # The hardened runtime only matters for notarization, which needs a Developer ID.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Education
  maintainer: Soumyaranjan Dash
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# No `publish` block and no auto-updater: the app never fetches or installs updates.
